name: weekly (playbook)

on:
  schedule:
    - cron: "23 6 * * 1" # Mondays 06:23 UTC
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
    env:
      NICHE: ${{ vars.NICHE || 'crypto' }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SITE_URL: ${{ vars.SITE_URL }}
      LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'anthropic' }}
      WRITE_PROVIDER: ${{ vars.WRITE_PROVIDER || vars.LLM_PROVIDER || 'anthropic' }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
      WRITE_MODEL: ${{ vars.WRITE_MODEL || 'claude-sonnet-5-5' }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_STATUS_CHAT_ID: ${{ secrets.TELEGRAM_STATUS_CHAT_ID }}
      TELEGRAM_PUBLIC_CHAT_ID: ${{ secrets.TELEGRAM_PUBLIC_CHAT_ID }}
      PRO_CHECKOUT_URL: ${{ vars.PRO_CHECKOUT_URL }}
      PRO_PRICE: ${{ vars.PRO_PRICE || '€25' }}
      FREE_CHANNEL_URL: ${{ vars.FREE_CHANNEL_URL }}
      NEWSLETTER_URL: ${{ vars.NEWSLETTER_URL }}
      CONTACT_URL: ${{ vars.CONTACT_URL }}
      X_PROFILE_URL: ${{ vars.X_PROFILE_URL }}
      BLUESKY_PROFILE_URL: ${{ vars.BLUESKY_PROFILE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m ioi.cli weekly
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - uses: actions/deploy-pages@v4
