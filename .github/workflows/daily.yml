name: daily (digest + website + RSS)

on:
  schedule:
    - cron: "41 5 * * *" # 05:41 UTC = 06:41 Amsterdam (winter time)
  workflow_dispatch:
    inputs:
      publish_only:
        description: "Only rebuild + deploy the website (no new digest, no Telegram post)"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ioi-daily
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
    env:
      NICHE: ${{ vars.NICHE || 'crypto' }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
      SITE_URL: ${{ vars.SITE_URL }}
      BRAND: ${{ vars.BRAND || 'IOI - Influencer of Influencers' }}
      LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'anthropic' }}
      WRITE_PROVIDER: ${{ vars.WRITE_PROVIDER || vars.LLM_PROVIDER || 'anthropic' }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      LLM_FALLBACK_MODELS: ${{ vars.LLM_FALLBACK_MODELS }}
      OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
      WRITE_MODEL: ${{ vars.WRITE_MODEL || 'claude-sonnet-5-5' }}
      DIGEST_LANGUAGE: ${{ vars.DIGEST_LANGUAGE || 'English' }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_STATUS_CHAT_ID: ${{ secrets.TELEGRAM_STATUS_CHAT_ID }}
      TELEGRAM_PUBLIC_CHAT_ID: ${{ secrets.TELEGRAM_PUBLIC_CHAT_ID }}
      PRO_CHECKOUT_URL: ${{ vars.PRO_CHECKOUT_URL }}
      PRO_PRICE: ${{ vars.PRO_PRICE || '€25' }}
      FREE_CHANNEL_URL: ${{ vars.FREE_CHANNEL_URL }}
      NEWSLETTER_URL: ${{ vars.NEWSLETTER_URL }}
      CONTACT_URL: ${{ vars.CONTACT_URL }}
      X_PROFILE_URL: ${{ vars.X_PROFILE_URL }}
      BLUESKY_PROFILE_URL: ${{ vars.BLUESKY_PROFILE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m ioi.cli daily
        if: ${{ !inputs.publish_only }}
      - run: python -m ioi.cli publish
        if: ${{ inputs.publish_only }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.deploy.outcome == 'failure'
        run: sleep 45
      - if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
