name: cycle (fetch + label + alerts)

on:
  schedule:
    # GitHub delays/skips frequent cron runs, so each run is ONE long job that runs a cycle
    # every 10 minutes for ~5h40m. The hourly schedule only makes sure a next job is queued
    # (concurrency keeps one running + one waiting). Public repo = free minutes.
    - cron: "7 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write # lets the loop start the daily/weekly workflows itself

concurrency:
  group: ioi-cycle
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      NICHE: ${{ vars.NICHE || 'crypto' }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
      X_MAX_RESULTS: ${{ vars.X_MAX_RESULTS || '20' }}
      X_MAX_READS_PER_DAY: ${{ vars.X_MAX_READS_PER_DAY || '1000' }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'anthropic' }}
      LABEL_PROVIDER: ${{ vars.LABEL_PROVIDER || vars.LLM_PROVIDER || 'anthropic' }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      LLM_FALLBACK_MODELS: ${{ vars.LLM_FALLBACK_MODELS }}
      OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
      LABEL_MODEL: ${{ vars.LABEL_MODEL || 'claude-haiku-5-5' }}
      WRITE_PROVIDER: ${{ vars.WRITE_PROVIDER || vars.LLM_PROVIDER || 'anthropic' }}
      WRITE_MODEL: ${{ vars.WRITE_MODEL || 'claude-sonnet-5-5' }}
      DIGEST_LANGUAGE: ${{ vars.DIGEST_LANGUAGE || 'English' }}
      BRAND: ${{ vars.BRAND || 'IOI - Influencer of Influencers' }}
      SOCIAL_ENABLED: ${{ vars.SOCIAL_ENABLED || '1' }}
      SOCIAL_MAX_PER_DAY: ${{ vars.SOCIAL_MAX_PER_DAY || '3' }}
      X_API_KEY: ${{ secrets.X_API_KEY }}
      X_API_SECRET: ${{ secrets.X_API_SECRET }}
      X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
      X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
      BLUESKY_HANDLE: ${{ vars.BLUESKY_HANDLE }}
      BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_STATUS_CHAT_ID: ${{ secrets.TELEGRAM_STATUS_CHAT_ID }}
      TELEGRAM_PRO_CHAT_ID: ${{ secrets.TELEGRAM_PRO_CHAT_ID }}
      TELEGRAM_PUBLIC_CHAT_ID: ${{ secrets.TELEGRAM_PUBLIC_CHAT_ID }}
      SITE_URL: ${{ vars.SITE_URL }}
      WHOP_API_KEY: ${{ secrets.WHOP_API_KEY }}
      SEC_CONTACT_EMAIL: ${{ vars.SEC_CONTACT_EMAIL }}
      CRYPTOPANIC_TOKEN: ${{ secrets.CRYPTOPANIC_TOKEN }}
      WHOP_COMPANY_ID: ${{ vars.WHOP_COMPANY_ID || 'biz_GUESEKFlsYSx61' }}
      WHOP_PRODUCT_ID: ${{ vars.WHOP_PRODUCT_ID || 'prod_o2ZmqDV2AoSr0' }}
      PRO_CHECKOUT_URL: ${{ vars.PRO_CHECKOUT_URL }}
      PRO_PRICE: ${{ vars.PRO_PRICE || '€25' }}
      FREE_CHANNEL_URL: ${{ vars.FREE_CHANNEL_URL }}
      NEWSLETTER_URL: ${{ vars.NEWSLETTER_URL }}
      CONTACT_URL: ${{ vars.CONTACT_URL }}
      X_PROFILE_URL: ${{ vars.X_PROFILE_URL }}
      BLUESKY_PROFILE_URL: ${{ vars.BLUESKY_PROFILE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m ioi.cli loop --minutes 340 --every 10
