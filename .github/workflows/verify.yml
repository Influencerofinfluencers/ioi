name: verify accounts

# Run by hand (Actions tab > verify accounts > Run workflow) after editing config/accounts.csv.
# Also runs automatically when accounts.csv changes.
on:
  workflow_dispatch:
    inputs:
      news_only:
        description: "only run the newswire check (no scout suggestions, no card tests)"
        type: boolean
        default: false
  push:
    paths: ["config/accounts.csv"]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NICHE: ${{ vars.NICHE || 'crypto' }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_STATUS_CHAT_ID: ${{ secrets.TELEGRAM_STATUS_CHAT_ID }}
      TELEGRAM_PRO_CHAT_ID: ${{ secrets.TELEGRAM_PRO_CHAT_ID }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
      LLM_FALLBACK_MODELS: ${{ vars.LLM_FALLBACK_MODELS }}
      WRITE_MODEL: ${{ vars.WRITE_MODEL || 'claude-sonnet-5-5' }}
      LABEL_MODEL: ${{ vars.LABEL_MODEL || 'claude-haiku-5-5' }}
      SITE_URL: ${{ vars.SITE_URL }}
      WHOP_API_KEY: ${{ secrets.WHOP_API_KEY }}
      SEC_CONTACT_EMAIL: ${{ vars.SEC_CONTACT_EMAIL }}
      CRYPTOPANIC_TOKEN: ${{ secrets.CRYPTOPANIC_TOKEN }}
      WHOP_COMPANY_ID: ${{ vars.WHOP_COMPANY_ID || 'biz_GUESEKFlsYSx61' }}
      WHOP_PRODUCT_ID: ${{ vars.WHOP_PRODUCT_ID || 'prod_o2ZmqDV2AoSr0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests
      - if: ${{ !inputs.news_only }}
        run: python -m ioi.cli verify
      - if: ${{ !inputs.news_only }}
        run: python -m ioi.cli pro-check
        continue-on-error: true
      - if: ${{ !inputs.news_only }}
        run: python -m ioi.cli llm-check
        continue-on-error: true
      - if: ${{ !inputs.news_only }}
        run: python -m ioi.cli card-test
        continue-on-error: true
      - if: ${{ !inputs.news_only }}
        run: python -m ioi.cli scout
        continue-on-error: true
      - run: python -m ioi.cli health
        continue-on-error: true
      - run: python -m ioi.cli yt-check
        continue-on-error: true
      - run: python -m ioi.cli news-check
        continue-on-error: true
