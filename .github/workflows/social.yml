name: social (automatic highlight posts)

on:
  # Scheduled posts run inside the cycle loop (GitHub skips cron runs). This is for a manual post.
  workflow_dispatch:
    inputs:
      mode:
        description: "post = post a highlight now, status = only show the last posts and their results"
        default: status

concurrency:
  group: ioi-social
  cancel-in-progress: false

jobs:
  social:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # emergency stop without code: set repository variable SOCIAL_ENABLED to 0
    env:
      NICHE: ${{ vars.NICHE || 'crypto' }}
      SOCIAL_ENABLED: ${{ vars.SOCIAL_ENABLED || '1' }}
      SOCIAL_MAX_PER_DAY: ${{ vars.SOCIAL_MAX_PER_DAY || '3' }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SITE_URL: ${{ vars.SITE_URL }}
      BRAND: ${{ vars.BRAND || 'IOI - Influencer of Influencers' }}
      LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'anthropic' }}
      WRITE_PROVIDER: ${{ vars.WRITE_PROVIDER || vars.LLM_PROVIDER || 'anthropic' }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      LLM_FALLBACK_MODELS: ${{ vars.LLM_FALLBACK_MODELS }}
      OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
      WRITE_MODEL: ${{ vars.WRITE_MODEL || 'claude-sonnet-5-5' }}
      DIGEST_LANGUAGE: ${{ vars.DIGEST_LANGUAGE || 'English' }}
      X_API_KEY: ${{ secrets.X_API_KEY }}
      X_API_SECRET: ${{ secrets.X_API_SECRET }}
      X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
      X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
      BLUESKY_HANDLE: ${{ vars.BLUESKY_HANDLE }}
      BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_STATUS_CHAT_ID: ${{ secrets.TELEGRAM_STATUS_CHAT_ID }}
      TELEGRAM_PUBLIC_CHAT_ID: ${{ secrets.TELEGRAM_PUBLIC_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m ioi.cli ${{ inputs.mode == 'post' && 'social' || 'social-status' }}
